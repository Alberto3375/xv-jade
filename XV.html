<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>XV Jade Yamilet · Mesas de Honor · 20 Enlaces Únicos</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200;300;400;500;600&family=Cinzel:wght@400;500;600;700;800;900&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: 'Inter', sans-serif;
    background: #0a0104;
    color: #f0ebe3;
    overflow-x: hidden;
}
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 30% 20%, rgba(100,15,25,0.5), rgba(5,1,3,0.98)),
                repeating-linear-gradient(45deg, rgba(212,175,55,0.04) 0px, rgba(212,175,55,0.04) 2px, transparent 2px, transparent 12px);
    pointer-events: none;
    z-index: -2;
}
body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(0.8px);
    z-index: -1;
}
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #1a050b; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #c92b3e, #9e2a2a); border-radius: 20px; }

/* Ornamentos */
.filigrana-esquina {
    position: fixed;
    width: 110px;
    height: 110px;
    pointer-events: none;
    z-index: 100;
    opacity: 0.85;
}
.esquina-tl { top: 15px; left: 15px; border-top: 2px solid #c92b3e; border-left: 2px solid #c92b3e; width: 80px; height: 80px; }
.esquina-tl::before { content: "⚜️"; position: absolute; top: -12px; left: -10px; color: #d4af37; font-size: 24px; }
.esquina-tr { top: 15px; right: 15px; border-top: 2px solid #c92b3e; border-right: 2px solid #c92b3e; width: 80px; height: 80px; }
.esquina-tr::before { content: "⚜️"; position: absolute; top: -12px; right: -10px; color: #d4af37; font-size: 24px; }
.esquina-bl { bottom: 15px; left: 15px; border-bottom: 2px solid #c92b3e; border-left: 2px solid #c92b3e; width: 80px; height: 80px; }
.esquina-bl::before { content: "⚜️"; position: absolute; bottom: -12px; left: -10px; color: #d4af37; font-size: 24px; }
.esquina-br { bottom: 15px; right: 15px; border-bottom: 2px solid #c92b3e; border-right: 2px solid #c92b3e; width: 80px; height: 80px; }
.esquina-br::before { content: "⚜️"; position: absolute; bottom: -12px; right: -10px; color: #d4af37; font-size: 24px; }

.victorian-divider {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1.2rem;
    margin: 2rem 0;
}
.victorian-divider .line {
    height: 1px;
    background: linear-gradient(90deg, transparent, #c92b3e, #d4af37, #c92b3e, transparent);
    width: 140px;
}
.victorian-divider i { color: #c92b3e; font-size: 1.5rem; text-shadow: 0 0 5px #d4af37; }

/* Header */
.header-mini {
    background: rgba(5,1,4,0.85);
    backdrop-filter: blur(12px);
    padding: 1rem 2rem;
    text-align: center;
    border-bottom: 1px solid #c92b3e;
}
.header-mini h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 2rem;
    color: #e6c27a;
}
.header-mini p {
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    letter-spacing: 2px;
}

/* Contenedor de enlaces - 20 links a mesas */
.links-container {
    max-width: 1300px;
    margin: 3rem auto;
    padding: 2rem;
}
.section-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(2rem, 5vw, 2.8rem);
    text-align: center;
    background: linear-gradient(135deg, #f3e2bc, #d4af37, #b02b3a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 0.5rem;
}
.subhead {
    text-align: center;
    color: #d4bc8a;
    margin-bottom: 2.5rem;
    letter-spacing: 1.5px;
}
.mesas-links-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.8rem;
}
.link-mesa-card {
    background: rgba(12, 3, 8, 0.85);
    backdrop-filter: blur(14px);
    border-radius: 2rem;
    border: 1px solid rgba(192, 43, 60, 0.6);
    transition: all 0.3s ease;
    text-decoration: none;
    display: block;
    overflow: hidden;
}
.link-mesa-card:hover {
    transform: translateY(-6px);
    border-color: #d4af37;
    box-shadow: 0 20px 35px rgba(0,0,0,0.5);
}
.link-mesa-header {
    background: linear-gradient(135deg, #1e0a12, #0d0307);
    padding: 1.2rem;
    text-align: center;
    border-bottom: 2px solid #c92b3e;
}
.link-mesa-header h3 {
    font-family: 'Cinzel', serif;
    font-size: 1.6rem;
    color: #e9d2a4;
}
.link-mesa-header i {
    color: #d4af37;
    margin-right: 8px;
}
.link-mesa-body {
    padding: 1rem;
    text-align: center;
    color: #e6d5b3;
}
.link-mesa-body p {
    font-size: 0.9rem;
}
.btn-link-mesa {
    display: inline-block;
    margin: 1rem auto 1.2rem;
    background: linear-gradient(95deg, #bc2f3e, #7e1c28);
    padding: 0.5rem 1.5rem;
    border-radius: 40px;
    color: #faeec7;
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    transition: 0.2s;
}
.link-mesa-card:hover .btn-link-mesa {
    background: linear-gradient(95deg, #d43f4e, #a12230);
    box-shadow: 0 0 8px rgba(212,175,55,0.5);
}

footer {
    text-align: center;
    padding: 2rem;
    background: rgba(0,0,0,0.85);
    border-top: 1px solid #bc2f3e;
    margin-top: 2rem;
}
@media (max-width: 768px) {
    .mesas-links-grid { grid-template-columns: 1fr; }
    .links-container { padding: 1rem; }
}
</style>
</head>
<body>

<div class="filigrana-esquina esquina-tl"></div>
<div class="filigrana-esquina esquina-tr"></div>
<div class="filigrana-esquina esquina-bl"></div>
<div class="filigrana-esquina esquina-br"></div>

<div class="header-mini">
    <h1>XV Jade Yamilet</h1>
    <p>⚜️ Victorian Majesty · Sangre & Oro ⚜️</p>
</div>

<div class="links-container">
    <div class="victorian-divider"><i class="fas fa-crown"></i><span class="line"></span><i class="fas fa-chair"></i><span class="line"></span><i class="fas fa-crown"></i></div>
    <h2 class="section-title">20 Mesas de Honor</h2>
    <div class="subhead">Cada enlace lleva a la invitación personalizada de cada mesa con sus invitados</div>
    <div id="mesasLinksGrid" class="mesas-links-grid"></div>
</div>

<footer>
    <div class="victorian-divider"><i class="fas fa-heart"></i><span class="line"></span><i class="fas fa-gem"></i><span class="line"></span><i class="fas fa-heart"></i></div>
    <p>24 de Mayo 2026 · Catedral 5:00 p.m. · Salón Jardín 7:00 p.m.</p>
    <p style="font-family: 'Great Vibes', cursive; font-size: 1.4rem;">"La elegancia nunca pasa de moda"</p>
</footer>

<script>
    // DATOS DE 20 MESAS CON SUS INVITADOS (cada mesa tiene su lista única)
    const mesasData = [
        { id: 1, nombre: "Mesa Imperial I", invitados: ["Don Fernando Reyes", "Doña Adriana Montes", "Carlos Reyes", "Mariana Reyes", "Luis Fernando Reyes"] },
        { id: 2, nombre: "Mesa Imperial II", invitados: ["Jorge Méndez", "Sofía Méndez", "Diego Valencia", "Valentina Herrera", "Mateo Flores"] },
        { id: 3, nombre: "Mesa del Rubí", invitados: ["Raúl Acosta", "Patricia López", "Mónica Acosta", "Andrés Acosta", "Camila Ruiz"] },
        { id: 4, nombre: "Mesa del Zafiro", invitados: ["Guillermo Figueroa", "Laura Valencia", "Emilio Figueroa", "Renata Figueroa", "Pablo Ortiz"] },
        { id: 5, nombre: "Mesa Esmeralda", invitados: ["Alberto Castro", "Maribel Castro", "Daniel Castro", "Samantha Castro", "Rodrigo Nava"] },
        { id: 6, nombre: "Mesa Diamante", invitados: ["Óscar Ríos", "Carmen Ríos", "Julieta Ríos", "Federico Ríos", "Ana Laura Gil"] },
        { id: 7, nombre: "Mesa Dorada", invitados: ["Héctor Vega", "Rocío Vega", "Iván Vega", "Diana Vega", "Mario Suárez"] },
        { id: 8, nombre: "Mesa Carmesí", invitados: ["Arturo Pineda", "Verónica Pineda", "Lorena Pineda", "Javier Pineda", "Karla Morales"] },
        { id: 9, nombre: "Mesa Escarlata", invitados: ["Gabriel Torres", "Elena Torres", "Nicolás Torres", "Jimena Torres", "Fernando Castillo"] },
        { id: 10, nombre: "Mesa de Ébano", invitados: ["Ricardo Rosas", "Claudia Rosas", "Adrián Rosas", "Valeria Rosas", "Esteban López"] },
        { id: 11, nombre: "Mesa Alba Real", invitados: ["Tomás Gálvez", "Paulina Gálvez", "Sebastián Gálvez", "Regina Gálvez", "Hugo Sandoval"] },
        { id: 12, nombre: "Mesa Rosa Noble", invitados: ["Eduardo Herrera", "Natalia Herrera", "Ximena Herrera", "Leonardo Herrera", "Martha Lira"] },
        { id: 13, nombre: "Mesa Aurora", invitados: ["Manuel Serrano", "Andrea Serrano", "Cristian Serrano", "Daniela Serrano", "Jesús Rangel"] },
        { id: 14, nombre: "Mesa Crepúsculo", invitados: ["Roberto Franco", "Silvia Franco", "Gerardo Franco", "Paulina Franco", "Julio César Díaz"] },
        { id: 15, nombre: "Mesa Victoria", invitados: ["Luis Ángel Soto", "Carolina Soto", "Kevin Soto", "Alejandra Soto", "Monserrat García"] },
        { id: 16, nombre: "Mesa Regia", invitados: ["Alonso Delgado", "Fabiola Delgado", "Bruno Delgado", "Camila Delgado", "Sergio Aguilar"] },
        { id: 17, nombre: "Mesa Príncipe", invitados: ["Francisco Olvera", "Marisol Olvera", "Derek Olvera", "Kiara Olvera", "Iker Mendoza"] },
        { id: 18, nombre: "Mesa Palatina", invitados: ["César Cabrera", "Margarita Cabrera", "Humberto Cabrera", "Liliana Cabrera", "Alan Zamora"] },
        { id: 19, nombre: "Mesa de los Espejos", invitados: ["Mauricio Vega", "Dulce Vega", "Saúl Vega", "Mireya Vega", "Bruno Rocha"] },
        { id: 20, nombre: "Mesa Eterna", invitados: ["Joaquín Fuentes", "Brenda Fuentes", "Emmanuel Fuentes", "Karen Fuentes", "Óscar Limón"] }
    ];

    // Función para generar el HTML de cada invitación de mesa (página individual)
    function generarPaginaMesa(mesa) {
        const invitadosListHTML = mesa.invitados.map(nombre => `
            <div class="invitado-item">
                <i class="fas fa-user-circle"></i>
                <span class="invitado-nombre">${nombre}</span>
            </div>
        `).join('');
        
        return `<!DOCTYPE html>
        <html lang="es">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
            <title>XV Jade Yamilet · ${mesa.nombre}</title>
            <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200;300;400;500;600&family=Cinzel:wght@400;500;600;700;800;900&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
            <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                    font-family: 'Inter', sans-serif;
                    background: #0a0104;
                    color: #f0ebe3;
                    min-height: 100vh;
                }
                body::before {
                    content: "";
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: radial-gradient(circle at 30% 20%, rgba(100,15,25,0.5), rgba(5,1,3,0.98)),
                                repeating-linear-gradient(45deg, rgba(212,175,55,0.04) 0px, rgba(212,175,55,0.04) 2px, transparent 2px, transparent 12px);
                    pointer-events: none;
                    z-index: -2;
                }
                body::after {
                    content: "";
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    backdrop-filter: blur(0.8px);
                    z-index: -1;
                }
                .hero-invitacion {
                    min-height: 100vh;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    position: relative;
                    padding: 2rem;
                    background-image: url('3.jpg');
                    background-size: cover;
                    background-position: center;
                    background-attachment: fixed;
                }
                .hero-invitacion::before {
                    content: "";
                    position: absolute;
                    inset: 0;
                    background: radial-gradient(circle at center, rgba(0,0,0,0.4), rgba(10,1,4,0.8));
                    z-index: 1;
                }
                .invitacion-card {
                    position: relative;
                    z-index: 30;
                    max-width: 800px;
                    width: 90%;
                    background: rgba(5, 1, 4, 0.75);
                    backdrop-filter: blur(16px);
                    border-radius: 60px;
                    padding: 2.5rem;
                    border: 1px solid rgba(212, 175, 55, 0.6);
                    box-shadow: 0 25px 45px rgba(0,0,0,0.6);
                    animation: fadeIn 1s ease;
                }
                @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(30px); }
                    to { opacity: 1; transform: translateY(0); }
                }
                .pre-badge {
                    font-family: 'Cinzel', serif;
                    font-size: 0.8rem;
                    letter-spacing: 4px;
                    color: #e6c27a;
                    background: rgba(0,0,0,0.5);
                    display: inline-block;
                    padding: 6px 20px;
                    border-radius: 40px;
                    margin-bottom: 1rem;
                    border: 1px solid #c92b3e;
                }
                .xv-number-small {
                    font-family: 'Cinzel', serif;
                    font-size: 3rem;
                    font-weight: 800;
                    background: linear-gradient(145deg, #f7e8bc, #d4af37, #b57c2c);
                    -webkit-background-clip: text;
                    background-clip: text;
                    color: transparent;
                }
                .nombre-titular {
                    font-family: 'Great Vibes', cursive;
                    font-size: 3rem;
                    color: #fff6ea;
                    text-shadow: 0 2px 15px #6b0f1a;
                    margin: 0.5rem 0;
                }
                .mesa-nombre {
                    font-family: 'Cinzel', serif;
                    font-size: 2rem;
                    color: #d4af37;
                    margin: 1rem 0;
                    border-top: 1px solid #c92b3e;
                    border-bottom: 1px solid #c92b3e;
                    display: inline-block;
                    padding: 0.5rem 1rem;
                }
                .invitados-lista {
                    margin: 2rem 0;
                    text-align: left;
                    background: rgba(0,0,0,0.4);
                    border-radius: 2rem;
                    padding: 1.5rem;
                }
                .invitados-lista h3 {
                    font-family: 'Cinzel', serif;
                    color: #e9d2a4;
                    margin-bottom: 1rem;
                    text-align: center;
                }
                .invitado-item {
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    padding: 0.7rem 0.5rem;
                    border-bottom: 1px dashed rgba(212,175,55,0.3);
                    font-size: 1rem;
                }
                .invitado-item i { color: #c92b3e; width: 28px; }
                .invitado-nombre { flex: 1; color: #f0e6d2; }
                .fecha-info {
                    text-align: center;
                    margin: 1.5rem 0;
                    font-family: 'Cinzel', serif;
                    color: #d4bc8a;
                }
                .btn-volver {
                    background: linear-gradient(95deg, #bc2f3e, #7e1c28);
                    border: none;
                    padding: 0.8rem 2rem;
                    border-radius: 60px;
                    color: #faeec7;
                    font-family: 'Cinzel', serif;
                    cursor: pointer;
                    text-decoration: none;
                    display: inline-block;
                    margin-top: 1rem;
                }
                .victorian-divider-sm {
                    display: flex;
                    justify-content: center;
                    gap: 1rem;
                    margin: 1rem 0;
                }
                .victorian-divider-sm .line { width: 60px; height: 1px; background: #c92b3e; margin: auto; }
                @media (max-width: 768px) {
                    .invitacion-card { padding: 1.5rem; }
                    .nombre-titular { font-size: 2rem; }
                    .mesa-nombre { font-size: 1.4rem; }
                }
            </style>
        </head>
        <body>
            <div class="hero-invitacion">
                <div class="invitacion-card">
                    <div style="text-align:center;">
                        <div class="pre-badge">⚜️ VICTORIAN MAJESTY ⚜️</div>
                        <div class="xv-number-small">XV</div>
                        <div class="nombre-titular">Jade Yamilet</div>
                        <div class="victorian-divider-sm"><span class="line"></span><i class="fas fa-crown" style="color:#d4af37;"></i><span class="line"></span></div>
                        <div class="mesa-nombre"><i class="fas fa-chair"></i> ${mesa.nombre}</div>
                        <div class="invitados-lista">
                            <h3><i class="fas fa-users"></i> Invitados de Honor</h3>
                            ${invitadosListHTML}
                        </div>
                        <div class="fecha-info">
                            <i class="fas fa-calendar-alt"></i> 24 de Mayo 2026 · 5:00 P.M.<br>
                            <i class="fas fa-church"></i> Catedral de Guadalajara · <i class="fas fa-glass-cheers"></i> Event's Salón Jardín
                        </div>
                        <a href="index.html" class="btn-volver"><i class="fas fa-arrow-left"></i> Volver a las Mesas</a>
                    </div>
                </div>
            </div>
        </body>
        </html>`;
    }

    // Generar todos los enlaces en la página principal
    function generarLinksDeMesas() {
        const gridContainer = document.getElementById('mesasLinksGrid');
        if (!gridContainer) return;
        
        gridContainer.innerHTML = '';
        mesasData.forEach(mesa => {
            const card = document.createElement('div');
            card.className = 'link-mesa-card';
            // Creamos un identificador único para cada página de mesa (se guardará en localStorage o se abrirá en nueva pestaña)
            // Para este sistema, generamos un blob URL o simplemente usamos javascript: para crear una nueva ventana con el contenido.
            // La mejor experiencia: al hacer clic, se abre una nueva pestaña con la invitación generada dinámicamente.
            card.innerHTML = `
                <div class="link-mesa-header">
                    <h3><i class="fas fa-crown"></i> ${mesa.nombre}</h3>
                    <small style="color:#d4af37;">Mesa N° ${mesa.id}</small>
                </div>
                <div class="link-mesa-body">
                    <p><i class="fas fa-user-friends"></i> ${mesa.invitados.length} invitados</p>
                    <div class="btn-link-mesa"><i class="fas fa-envelope-open-text"></i> Ver invitación completa</div>
                </div>
            `;
            card.addEventListener('click', (e) => {
                e.preventDefault();
                // Generar la página HTML de la mesa
                const paginaHTML = generarPaginaMesa(mesa);
                // Crear un blob y abrir en nueva pestaña
                const blob = new Blob([paginaHTML], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
                // Liberar URL después de un tiempo
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            });
            gridContainer.appendChild(card);
        });
    }

    generarLinksDeMesas();
</script>
</body>
</html>
